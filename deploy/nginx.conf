# /etc/nginx/sites-available/utax-finance.conf
limit_req_zone $binary_remote_addr zone=finance_api:10m rate=20r/s;
server {
    listen 80;
    server_name finance.utax.uz;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name finance.utax.uz;
    ssl_certificate     /etc/letsencrypt/live/finance.utax.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.utax.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 30m;
    location /api/ {
        limit_req zone=finance_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    # Telegram webhook (BOT_MODE=webhook): POST /telegram/<bot> — ilova X-Telegram-Bot-Api-Secret-Token ni tekshiradi
    location /telegram/ {
        limit_req zone=finance_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
