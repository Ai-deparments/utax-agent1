services:
  finance:
    build: .
    container_name: utax-finance
    restart: unless-stopped
    environment:
      - PORT=8100
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/finance.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - SECRETS_KEY=${SECRETS_KEY:?set SECRETS_KEY in .env}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-5}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-}
      - EMAIL_WEBHOOK_URL=${EMAIL_WEBHOOK_URL:-}
      - SEED_ON_EMPTY=${SEED_ON_EMPTY:-true}
    volumes:
      - finance-data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
  # nginx (TLS) — deploy/nginx.conf ni ishlating; certbot bilan sertifikat oling
volumes:
  finance-data:
