services:
  finance:
    build: .
    container_name: utax-finance
    restart: unless-stopped
    # .env dagi barcha o'zgaruvchilar (GEMINI_*, GROQ_*, AI_*, BOT_*, APP_TZ ...) konteynerga o'tadi.
    # Image ichida .env yo'q (Dockerfile uni COPY qilmaydi) — config.mjs konteynerda faqat process.env ni ko'radi.
    # `required: false` — Docker Compose >= 2.24 (eski versiyada: `env_file: .env` qatoriga almashtiring).
    env_file:
      - path: .env
        required: false
    # environment: env_file'dan ustun. PORT/HOST/DB_PATH — konteyner ichidagi qiymatlar (majburiy override).
    # Bo'sh qiymat = config.mjs default'i (src/core/config.mjs — yagona manba).
    environment:
      - PORT=8100
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/finance.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - SECRETS_KEY=${SECRETS_KEY:?set SECRETS_KEY in .env}
      # Vaqt zonasi: scheduler (01:00 revenue, 03:00 backup, 08:30 digest) va "bugun" sanasi shu zonada
      - APP_TZ=${APP_TZ:-Asia/Tashkent}
      # AI: Gemini asosiy → Groq zaxira → qoidalar dvigateli (kalit yo'q bo'lsa)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-}
      - GEMINI_RPM=${GEMINI_RPM:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - GROQ_FALLBACK_MODEL=${GROQ_FALLBACK_MODEL:-}
      - AI_MASK_NAMES=${AI_MASK_NAMES:-}
      - AI_MEMORY_TURNS=${AI_MEMORY_TURNS:-}
      - AI_MEMORY_HOURS=${AI_MEMORY_HOURS:-}
      - AI_MAX_TOOLS=${AI_MAX_TOOLS:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-}
      # Telegram botlar (docs/BOTS.md)
      - BOT_RAHBAR_TOKEN=${BOT_RAHBAR_TOKEN:-}
      - BOT_BUXGALTER_TOKEN=${BOT_BUXGALTER_TOKEN:-}
      - BOT_SOROV_TOKEN=${BOT_SOROV_TOKEN:-}
      - BOT_SIGNAL_TOKEN=${BOT_SIGNAL_TOKEN:-}
      - BOT_OWNER_IDS=${BOT_OWNER_IDS:-}
      - BOT_MODE=${BOT_MODE:-polling}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - WEBAPP_URL=${WEBAPP_URL:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - TELEGRAM_ALERT_CHAT_ID=${TELEGRAM_ALERT_CHAT_ID:-}
      - EMAIL_WEBHOOK_URL=${EMAIL_WEBHOOK_URL:-}
      - SEED_ON_EMPTY=${SEED_ON_EMPTY:-true}
    volumes:
      - finance-data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
  # nginx (TLS) — deploy/nginx.conf ni ishlating; certbot bilan sertifikat oling
volumes:
  finance-data:
